<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zero Sidekick</title>
<style>
/* ============ ZERO SIDEKICK — LUXE EDITION ============ */
:root{
  --bg:#f7f5f0; --bg2:#efede8;
  --card:rgba(255,255,255,.85); --card-solid:#ffffff;
  --ink:#1a1a2e; --ink-soft:#2d2d44; --muted:#8a8a9e; --faint:#b8b8c8;
  --line:rgba(20,20,40,.08); --line-strong:rgba(20,20,40,.14);
  --blue:#0a66ff; --blue-d:#0052cc; --blue-glow:rgba(10,102,255,.25);
  --gold:#c9a96a; --gold-lt:#e8d5a8;
  --chip:rgba(20,20,40,.045);
  --shadow-sm:0 1px 2px rgba(20,20,40,.05), 0 2px 8px rgba(20,20,40,.06);
  --shadow-md:0 2px 4px rgba(20,20,40,.06), 0 8px 24px rgba(20,20,40,.09);
  --shadow-lg:0 4px 8px rgba(20,20,40,.07), 0 16px 48px rgba(20,20,40,.12);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d0d14; --bg2:#12121c;
    --card:rgba(28,28,42,.78); --card-solid:#1c1c2a;
    --ink:#f4f2ec; --ink-soft:#d8d6cc; --muted:#9a98ad; --faint:#5c5a70;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --blue:#3d8bff; --blue-d:#2d6fe0; --blue-glow:rgba(61,139,255,.3);
    --gold:#d4b87a; --gold-lt:#8a7340;
    --chip:rgba(255,255,255,.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
    --shadow-md:0 2px 4px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg:0 4px 8px rgba(0,0,0,.4), 0 16px 48px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:14px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* ---------- header : frosted luxe ---------- */
.hd{
  display:flex;align-items:center;gap:11px;padding:13px 16px;flex-shrink:0;
  background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--line);position:relative;z-index:10;
}
.hd::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-lt) 30%,var(--gold-lt) 70%,transparent);opacity:.35}
.mark{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#fff 0%,#f0ede6 100%);
  border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;color:var(--blue);
  box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.8);
}
@media (prefers-color-scheme:dark){.mark{background:linear-gradient(135deg,#2a2a3e,#1a1a28);}}
.hd-name{font-weight:800;font-size:15.5px;letter-spacing:-.3px}
.hd-sub{font-size:11px;color:var(--muted);letter-spacing:.2px;margin-top:1px}
.hd-sp{flex:1}
.hbtn{
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:12px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .22s var(--ease);backdrop-filter:blur(8px);
}
.hbtn:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hbtn:active{transform:translateY(0) scale(.96)}
.hbtn svg{width:17px;height:17px}
/* ---------- overlays ---------- */
.ov{
  position:absolute;top:62px;left:12px;right:12px;z-index:50;max-height:62%;overflow:auto;padding:18px;
  background:var(--card);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow-lg);display:none;
}
.ov.open{display:block;animation:pop .32s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.ov h3{font-size:11.5px;font-weight:800;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.upd{padding:12px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.6}
.upd:first-of-type{border-top:0}
.upd .k{display:inline-block;font-size:10px;font-weight:700;background:linear-gradient(135deg,var(--gold-lt),var(--gold));
  color:#fff;border-radius:7px;padding:3px 9px;margin-right:8px;text-transform:uppercase;letter-spacing:.5px}
.upd .t{font-size:11px;color:var(--muted);margin-top:4px}
/* ---------- messages ---------- */
#msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
#msgs::-webkit-scrollbar{width:5px}
#msgs::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
.greet{text-align:center;padding:30px 12px 8px;animation:msgIn .5s var(--ease)}
.greet .big{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:14px 0 8px;
  background:linear-gradient(135deg,var(--ink) 40%,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.greet .sub{font-size:13.5px;color:var(--muted);line-height:1.6;max-width:290px;margin:0 auto}
.greet .mark{width:58px;height:58px;font-size:32px;margin:0 auto;box-shadow:var(--shadow-md)}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:16px 10px 6px}
.chip{
  border:1px solid var(--line-strong);background:var(--card);backdrop-filter:blur(8px);
  border-radius:999px;padding:10px 17px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  transition:all .25s var(--ease);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm);
}
.chip:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.chip:active{transform:translateY(0) scale(.97)}
.chip svg{width:14px;height:14px}
.msg{max-width:93%;line-height:1.65;font-size:13.8px;animation:msgIn .4s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.u{
  align-self:flex-end;color:#fff;border-radius:20px 20px 6px 20px;padding:11px 16px;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  box-shadow:0 2px 8px var(--blue-glow), var(--shadow-sm);
}
.msg.a{
  align-self:flex-start;background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px 17px;
  box-shadow:var(--shadow-sm);
}
.msg.a h1,.msg.a h2,.msg.a h3{font-size:14px;margin:10px 0 5px;letter-spacing:-.2px}
.msg.a p{margin:7px 0}
.msg.a ul,.msg.a ol{margin:7px 0 7px 20px}
.msg.a li{margin:4px 0}
.msg.a code{background:var(--chip);border-radius:7px;padding:2px 7px;font-size:12.5px;
  font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;border:1px solid var(--line)}
.msg.a pre{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto}
.msg.a pre code{background:none;padding:0;border:0}
.msg.a a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue-glow)}
.msg img.att{display:block;max-width:210px;border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow-md)}
.typing{display:inline-flex;gap:6px;padding:8px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.5;animation:tp 1.3s infinite var(--ease-io)}
.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.srcs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.src{font-size:11.5px;color:var(--blue);border:1px solid var(--line-strong);border-radius:999px;
  padding:5px 12px;text-decoration:none;background:var(--card);transition:all .2s var(--ease)}
.src:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.err{
  background:linear-gradient(135deg,rgba(253,238,238,.9),rgba(253,238,238,.7));
  backdrop-filter:blur(8px);border:1px solid rgba(245,198,198,.6);color:#a33;
  border-radius:16px;padding:13px 16px;font-size:13px;align-self:flex-start;max-width:93%;box-shadow:var(--shadow-sm);
}
@media (prefers-color-scheme:dark){.err{background:rgba(58,29,29,.7);border-color:rgba(92,43,43,.5);color:#f0b0b0}}
/* ---------- sharing bar ---------- */
#ctxrow{display:none;flex-shrink:0;padding:0 16px 10px}
#ctxrow.show{display:block;animation:msgIn .35s var(--ease)}
.ctxchip{
  display:flex;align-items:center;gap:9px;background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--line-strong);border-radius:14px;padding:10px 13px;font-size:13px;
  box-shadow:var(--shadow-sm);margin-bottom:7px;transition:all .25s var(--ease);
}
.ctxchip:hover{box-shadow:var(--shadow-md);transform:translateX(2px)}
.ctxchip:last-child{margin-bottom:0}
.ctxchip svg{width:15px;height:15px;flex-shrink:0;color:#e11d2e}
.ctxchip .share-t{flex:1;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
.ctxchip button{border:0;background:var(--chip);color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ctxchip button:hover{background:rgba(200,40,40,.12);color:#c33}
#imgrow{display:none;padding:0 16px 10px;flex-shrink:0}
#imgrow.show{display:block;animation:msgIn .35s var(--ease)}
#imgprev{position:relative;display:inline-block}
#imgprev img{max-width:130px;border-radius:14px;border:1px solid var(--line-strong);display:block;box-shadow:var(--shadow-md)}
#imgprev button{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--line-strong);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
  box-shadow:var(--shadow-sm);transition:all .2s}
#imgprev button:hover{color:#c33;transform:scale(1.1)}
/* ---------- composer : luxe card ---------- */
.cp{padding:10px 16px 16px;background:transparent;flex-shrink:0}
.cpcard{
  background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line-strong);border-radius:24px;box-shadow:var(--shadow-md);overflow:hidden;
  transition:box-shadow .3s var(--ease), transform .3s var(--ease);
}
.cpcard:focus-within{box-shadow:var(--shadow-lg), 0 0 0 3px var(--blue-glow)}
#qin{
  width:100%;border:0;background:none;outline:none;resize:none;font:inherit;font-size:15px;
  color:var(--ink);padding:16px 18px 8px;line-height:1.55;max-height:130px;display:block;letter-spacing:-.1px;
}
#qin::placeholder{color:var(--faint);opacity:1}
.cpbar{display:flex;align-items:center;gap:2px;padding:8px 12px 12px}
.cbtn{
  border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .22s var(--ease);
}
.cbtn:hover{background:var(--chip);color:var(--ink);transform:scale(1.08)}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:19px;height:19px}
.cbtn.busy{color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cpsp{flex:1}
.lvl{
  border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:600;
  padding:9px 8px;cursor:pointer;outline:none;letter-spacing:-.1px;transition:color .2s;
}
.lvl:hover{color:var(--ink)}
.sendbtn{
  border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  box-shadow:0 3px 12px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,.25);
  transition:all .25s var(--ease);
}
.sendbtn:hover{transform:scale(1.08) translateY(-1px);box-shadow:0 5px 18px var(--blue-glow)}
.sendbtn:active{transform:scale(.95)}
.sendbtn svg{width:18px;height:18px}
.sendbtn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.honest{display:none}
/* ---------- toast ---------- */
#toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;letter-spacing:-.1px;
  border-radius:14px;padding:11px 20px;opacity:0;pointer-events:none;
  transition:all .3s var(--ease);z-index:99;max-width:88%;text-align:center;
  box-shadow:var(--shadow-lg);backdrop-filter:blur(8px);
}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- update banner ---------- */
#skUpd{background:linear-gradient(135deg,#1a73e8,#6c3df5);color:#fff;padding:12px 14px;font-size:12.5px;position:relative;z-index:60;box-shadow:var(--shadow-md)}
.sk-upd-in{display:flex;align-items:center;gap:10px}
.sk-upd-t{font-weight:600;flex:1;line-height:1.4}
.sk-upd-btn{background:#fff;color:#1a73e8;font-weight:700;font-size:12px;padding:8px 16px;border-radius:999px;
  text-decoration:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .2s var(--ease)}
.sk-upd-btn:hover{transform:scale(1.05)}
.sk-upd-x{background:none;border:none;color:#fff;font-size:13px;cursor:pointer;opacity:.8;padding:4px}
.sk-upd-sub{font-size:11px;opacity:.85;margin-top:7px;line-height:1.45}
.skdet{margin-top:9px;font-size:11px}.skdet summary{cursor:pointer;opacity:.7;font-weight:600}
.skdet pre{white-space:pre-wrap;word-break:break-word;background:var(--chip);border:1px solid var(--line);
  border-radius:10px;padding:9px;font-size:10.5px;max-height:160px;overflow:auto}
/* ---------- task card ---------- */
.taskcard{border:1px solid var(--line-strong);border-radius:18px;padding:14px;background:var(--card);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(8px)}
.taskcard-head{display:flex;align-items:center;gap:11px}
.mark.sm{width:30px;height:30px;font-size:15px}
.taskcard-title{font-weight:700;font-size:14px;letter-spacing:-.2px}
.taskcard-status{font-size:11.5px;color:var(--muted);margin-top:2px}
.taskcard-stop{margin-left:auto;cursor:pointer;opacity:.45;font-size:12px;padding:8px;border-radius:50%;transition:all .2s}
.taskcard-stop:hover{opacity:1;background:rgba(200,40,40,.1);color:#c33}
.tasklog{font-size:12px;color:var(--muted);max-height:190px;overflow:auto;margin-top:12px;line-height:1.8}
.tasklog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.taskshots{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.taskshots img{width:130px;border-radius:12px;border:1px solid var(--line-strong);cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .25s var(--ease)}
.taskshots img:hover{transform:scale(1.04)}
/* ---------- history ---------- */
.histitem{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;cursor:pointer;
  font-size:13px;transition:background .2s}
.histitem:hover{background:var(--chip)}
.histitem .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:-.1px}
.histitem .d{font-size:11px;color:var(--muted)}
.histitem .x{opacity:.5;border:none;background:none;cursor:pointer;font-size:15px;padding:5px;border-radius:50%}
.histitem .x:hover{opacity:1;background:rgba(200,40,40,.1);color:#c33}
/* ---------- organized message chrome (v3.1.0) ---------- */
/* ---------- attach menu ---------- */
.attachmenu{
  position:absolute;bottom:92px;left:16px;right:16px;z-index:60;padding:10px;
  background:var(--card);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow-lg);
  display:none;max-height:52%;overflow-y:auto;
}
.attachmenu.open{display:block;animation:pop .28s var(--ease)}
.am-head{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:9px 13px 5px}
.am-item{
  display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;
  padding:12px 13px;font-size:13.5px;color:var(--ink);border-radius:13px;cursor:pointer;text-align:left;
  font-weight:500;transition:all .2s var(--ease);letter-spacing:-.1px;
}
.am-item:hover{background:var(--chip);transform:translateX(3px)}
.am-item:active{transform:translateX(3px) scale(.98)}
.am-item svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.am-item .am-check{margin-left:auto;color:var(--blue);font-size:16px;font-weight:800}
.am-item .am-new{font-size:10px;font-weight:700;background:linear-gradient(135deg,#e3f2fd,#bbdefb);
  color:#1565c0;border-radius:999px;padding:3px 9px;margin-left:3px;letter-spacing:.3px}
.am-item .am-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am-item .am-sub{font-size:11px;color:var(--muted);display:block;font-weight:400;margin-top:2px}

/* ============ ULTRA-PREMIUM : beyond luxe ============ */
/* Signature shimmer on the Zero mark */
.mark{position:relative;overflow:hidden}
.mark::before{
  content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,rgba(201,169,106,.4) 52%,transparent 70%);
  animation:shimmer 5s ease-in-out infinite;pointer-events:none;
}
@keyframes shimmer{0%,60%{transform:translateX(-70%) rotate(0.001deg)}100%{transform:translateX(70%) rotate(0.001deg)}}
/* Gold hairline dividers with glow */
.msg.a{position:relative}
.msg.a::before{
  content:"";position:absolute;top:0;left:18px;right:18px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,169,106,.35),transparent);
}
/* Composer: precision instrument */
.cpcard{position:relative}
.cpcard::before{
  content:"";position:absolute;inset:0;border-radius:24px;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(201,169,106,.4),transparent 30%,transparent 70%,rgba(201,169,106,.25));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
/* Send button: jewel */
.sendbtn{position:relative;overflow:hidden}
.sendbtn::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg);transition:left .6s var(--ease);
}
.sendbtn:hover::after{left:130%}
/* Staggered message entrance */
.msg:nth-child(1){animation-delay:.02s}.msg:nth-child(2){animation-delay:.06s}
.msg:nth-child(3){animation-delay:.1s}.msg:nth-child(4){animation-delay:.14s}
/* Refined scrollbar */
#msgs::-webkit-scrollbar{width:6px}
#msgs::-webkit-scrollbar-track{background:transparent}
#msgs::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));
  border-radius:99px;opacity:.5;
}
/* Chip hover: lift with gold underline */
.chip{position:relative}
.chip::after{
  content:"";position:absolute;bottom:6px;left:17px;right:17px;height:1.5px;
  background:linear-gradient(90deg,var(--gold),transparent);
  opacity:0;transition:opacity .25s var(--ease);
}
.chip:hover::after{opacity:1}
/* Sharing bar: premium tag */
.ctxchip{border-left:3px solid var(--gold)}
/* Header: subtle depth */
.hd{background:linear-gradient(180deg,var(--card) 0%,transparent 130%)}
/* Selection color */
::selection{background:rgba(201,169,106,.3)}
/* Focus rings: gold */
#qin:focus{outline:none}
.cpcard:focus-within{box-shadow:var(--shadow-lg),0 0 0 3px rgba(201,169,106,.18)}
/* Premium toggle for depth selector */
.lvl{
  background:linear-gradient(135deg,var(--chip),transparent);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-weight:700;letter-spacing:.2px;
}
.lvl:hover{border-color:var(--gold-lt)}

/* ============ SIGNATURE ZERO : beyond everything ============ */
/* Living background: barely-there aurora */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    radial-gradient(600px 400px at 20% 0%,rgba(201,169,106,.06),transparent 60%),
    radial-gradient(500px 380px at 85% 30%,rgba(10,102,255,.05),transparent 60%),
    radial-gradient(700px 500px at 50% 100%,rgba(201,169,106,.04),transparent 60%);
  animation:aurora 18s ease-in-out infinite alternate;
}
@keyframes aurora{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(2%,1%) scale(1.02)}
  100%{transform:translate(-1%,2%) scale(1)}
}
#msgs,.cp,.hd{position:relative;z-index:1}
/* The Zero jewel: rotating conic glow */
.mark{
  background:conic-gradient(from 0deg,#fff,#f5f0e6,#fff,#eef4ff,#fff) !important;
  position:relative;
}
.mark::after{
  content:"0";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--blue);font-size:inherit;
}
.mark{color:transparent !important}
/* Message bloom: blur + scale + rise */
@keyframes bloom{
  0%{opacity:0;transform:translateY(14px) scale(.97);filter:blur(6px)}
  60%{filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
.msg{animation:bloom .55s cubic-bezier(.22,1,.36,1)}
.msg.u{animation-name:bloomR}
@keyframes bloomR{
  0%{opacity:0;transform:translateY(14px) scale(.97);filter:blur(6px)}
  60%{filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
/* AI messages: silk */
.msg.a{
  background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
  box-shadow:0 1px 3px rgba(20,20,40,.06),0 8px 28px rgba(20,20,40,.08),inset 0 1px 0 rgba(255,255,255,.9);
}
@media (prefers-color-scheme:dark){
  .msg.a{background:linear-gradient(165deg,rgba(34,34,50,.92),rgba(28,28,42,.82))}
}
/* User messages: liquid blue */
.msg.u{
  background:linear-gradient(135deg,#2b7fff 0%,#0a5cf0 50%,#0043c7 100%);
  box-shadow:0 2px 12px rgba(10,102,255,.35),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.1);
}
/* Composer: carved obsidian glass */
.cpcard{
  background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,255,255,.82));
  box-shadow:0 2px 6px rgba(20,20,40,.07),0 12px 40px rgba(20,20,40,.11),inset 0 1px 0 rgba(255,255,255,1);
}
@media (prefers-color-scheme:dark){
  .cpcard{background:linear-gradient(170deg,rgba(32,32,48,.95),rgba(24,24,38,.88))}
}
.cpcard:focus-within{
  box-shadow:0 2px 6px rgba(20,20,40,.07),0 16px 52px rgba(20,20,40,.14),
    0 0 0 3px rgba(201,169,106,.22),inset 0 1px 0 rgba(255,255,255,1);
  transform:translateY(-1px);
}
/* Textarea: editorial */
#qin{
  font-size:15.5px;line-height:1.6;letter-spacing:-.15px;
  font-weight:400;
}
#qin::placeholder{letter-spacing:-.1px}
/* Send: the jewel button */
.sendbtn{
  width:40px;height:40px;
  background:conic-gradient(from 200deg,#2b7fff,#0a5cf0,#6a3df5,#2b7fff);
  background-size:200% 200%;animation:jewel 6s ease infinite;
  box-shadow:0 4px 16px rgba(10,102,255,.4),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.15);
}
@keyframes jewel{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sendbtn:hover{transform:scale(1.1) rotate(4deg)}
/* Chips: porcelain */
.chip{
  background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,255,255,.8));
  box-shadow:0 1px 3px rgba(20,20,40,.07),0 4px 14px rgba(20,20,40,.06),inset 0 1px 0 #fff;
  border:1px solid rgba(20,20,40,.09);
  font-weight:650;letter-spacing:-.15px;
}
@media (prefers-color-scheme:dark){
  .chip{background:linear-gradient(170deg,rgba(40,40,58,.9),rgba(32,32,48,.85))}
}
.chip:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 6px rgba(20,20,40,.08),0 10px 28px rgba(10,102,255,.14),inset 0 1px 0 #fff;
  border-color:rgba(10,102,255,.3);
}
/* Sharing tags: gold-sealed */
.ctxchip{
  background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,250,240,.9));
  border:1px solid rgba(201,169,106,.3);border-left:3px solid var(--gold);
  box-shadow:0 2px 8px rgba(201,169,106,.12),inset 0 1px 0 #fff;
}
@media (prefers-color-scheme:dark){
  .ctxchip{background:linear-gradient(170deg,rgba(40,36,28,.9),rgba(32,30,24,.85))}
}
/* Header: gallery */
.hd{
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.75));
  border-bottom:1px solid rgba(20,20,40,.07);
}
@media (prefers-color-scheme:dark){
  .hd{background:linear-gradient(180deg,rgba(24,24,36,.95),rgba(20,20,30,.8))}
}
.hd-name{
  font-size:16px;letter-spacing:-.4px;
  background:linear-gradient(135deg,var(--ink),var(--ink) 60%,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
/* Greeting: exhibition */
.greet .big{
  font-size:26px;letter-spacing:-.8px;font-weight:850;
  background:linear-gradient(135deg,#1a1a2e 20%,#c9a96a 55%,#0a66ff 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:greetSheen 8s ease-in-out infinite;background-size:200% auto;
}
@keyframes greetSheen{0%,100%{background-position:0% center}50%{background-position:100% center}}
@media (prefers-color-scheme:dark){
  .greet .big{background:linear-gradient(135deg,#f4f2ec 20%,#d4b87a 55%,#3d8bff 90%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto}
}
/* Task card: command center */
.taskcard{
  background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(248,246,240,.92));
  border:1px solid rgba(201,169,106,.25);
  box-shadow:0 4px 16px rgba(20,20,40,.09),inset 0 1px 0 #fff;
}
@media (prefers-color-scheme:dark){
  .taskcard{background:linear-gradient(170deg,rgba(36,34,30,.95),rgba(28,28,36,.92))}
}
/* Attach menu: vault */
.attachmenu{
  background:linear-gradient(170deg,rgba(255,255,255,.97),rgba(250,248,243,.94));
  border:1px solid rgba(201,169,106,.2);
}
@media (prefers-color-scheme:dark){
  .attachmenu{background:linear-gradient(170deg,rgba(30,30,44,.97),rgba(24,24,36,.95))}
}
/* Code blocks: ink */
.msg.a pre{
  background:linear-gradient(170deg,#1e1e2e,#161624);
  border:1px solid rgba(255,255,255,.08);color:#e8e6f0;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.3);
}
.msg.a pre code{color:#e8e6f0}
.msg.a code{
  background:rgba(201,169,106,.12);border:1px solid rgba(201,169,106,.2);color:var(--ink);
}
@media (prefers-color-scheme:dark){
  .msg.a code{background:rgba(201,169,106,.15);color:#f0e8d0}
}
/* Typing: breathing gold */
.typing span{background:var(--gold);box-shadow:0 0 8px rgba(201,169,106,.5)}
/* Scrollbar: thread of gold */
#msgs::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(201,169,106,.6),rgba(201,169,106,.3));
  border:2px solid transparent;background-clip:padding-box;
}
/* ============ EDITORIAL v3.1.0 : neat, organized, better ============ */
.msg.a h2.sk-h{
  font-size:14.5px;font-weight:800;letter-spacing:-.35px;margin:15px 0 7px;padding-bottom:8px;
  border-bottom:1.5px solid transparent;
  border-image:linear-gradient(90deg,var(--gold) 0%,rgba(201,169,106,.15) 60%,transparent 100%) 1;
}
.msg.a h3.sk-h{font-size:13.5px;font-weight:750;letter-spacing:-.25px;margin:13px 0 6px;color:var(--ink-soft)}
.msg.a h4.sk-h{font-size:12px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.msg.a h2.sk-h:first-child,.msg.a h3.sk-h:first-child,.msg.a h4.sk-h:first-child{margin-top:2px}
.sk-twrap{overflow-x:auto;margin:11px -5px;padding:2px 5px}
table.sk-t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px;background:var(--card);
  border:1px solid var(--line-strong);border-radius:13px;overflow:hidden;box-shadow:var(--shadow-sm)}
.sk-t th{background:linear-gradient(180deg,rgba(201,169,106,.16),rgba(201,169,106,.05));font-weight:750;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:9px 13px;text-align:left;
  border-bottom:1px solid var(--line-strong);white-space:nowrap}
.sk-t td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
.sk-t tbody tr:last-child td{border-bottom:0}
.sk-t tbody tr:nth-child(even) td{background:rgba(20,20,40,.02)}
@media (prefers-color-scheme:dark){.sk-t tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}}
.sk-callout{border-left:3px solid var(--gold);background:linear-gradient(135deg,rgba(201,169,106,.12),rgba(201,169,106,.02));
  border-radius:0 13px 13px 0;padding:11px 15px;margin:11px 0;font-size:13px;line-height:1.65}
.sk-callout p{margin:5px 0 !important}
.msg.a ul,.msg.a ol{margin:8px 0 8px 20px;padding:0}
.msg.a ul ul,.msg.a ol ol,.msg.a ul ol,.msg.a ol ul{margin:5px 0 5px 18px}
.msg.a li{margin:6px 0;padding-left:2px}
.msg.a li::marker{color:var(--gold);font-weight:800}
.sk-check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.sk-check input{margin-top:4px;accent-color:var(--gold);width:15px;height:15px;flex-shrink:0;cursor:pointer}
.sk-hr{border:0;height:1px;margin:15px 4px;background:linear-gradient(90deg,transparent,rgba(201,169,106,.55),transparent)}
.sk-code{margin:11px 0;border-radius:13px;overflow:hidden;border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.35)}
.sk-code-h{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.045);
  padding:8px 13px;font-size:10.5px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase;color:#9a98ad}
.sk-code-c{border:0;background:none;cursor:pointer;color:#9a98ad;font-size:11.5px;font-weight:650;letter-spacing:.2px}
.sk-code-c:hover{color:#fff}
.sk-code pre{margin:0 !important;border:0 !important;border-radius:0 !important;box-shadow:none !important}
.sk-code .tok-k{color:#c792ea}.sk-code .tok-s{color:#a8d18d}.sk-code .tok-c{color:#7a8494;font-style:italic}.sk-code .tok-n{color:#f2b86b}
.sk-code-long summary{cursor:pointer;font-size:11.5px;color:#9a98ad;padding:9px 13px;font-weight:650;list-style:none}
.sk-code-long summary:hover{color:#d8d6cc}
.sk-foot{display:flex;align-items:center;gap:2px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  opacity:0;transition:opacity .25s var(--ease)}
.msg.a:hover .sk-foot{opacity:1}
@media (hover:none){.sk-foot{opacity:1}}
.sk-act{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:650;cursor:pointer;
  padding:7px 11px;border-radius:10px;display:flex;align-items:center;gap:7px;letter-spacing:-.1px;transition:all .2s var(--ease)}
.sk-act:hover{background:var(--chip);color:var(--ink)}
.sk-act svg{width:13px;height:13px}
.sk-time{margin-left:auto;font-size:10.5px;color:var(--faint);letter-spacing:.3px;padding-right:4px}
.sk-follow{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;align-self:flex-start;max-width:94%;animation:msgIn .45s var(--ease)}
.sk-fchip{border:1px solid rgba(201,169,106,.4);
  background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,250,240,.8));
  color:var(--ink-soft);border-radius:999px;padding:9px 16px;font-size:12px;font-weight:650;cursor:pointer;
  transition:all .25s var(--ease);box-shadow:var(--shadow-sm);letter-spacing:-.1px}
.sk-fchip:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow-md);color:var(--ink)}
.sk-fchip:active{transform:scale(.97)}
@media (prefers-color-scheme:dark){.sk-fchip{background:linear-gradient(170deg,rgba(42,38,30,.92),rgba(32,30,26,.88))}}
#skDown{position:fixed;bottom:108px;left:50%;transform:translateX(-50%) translateY(10px);z-index:45;
  background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-size:12px;font-weight:750;
  cursor:pointer;opacity:0;pointer-events:none;transition:all .3s var(--ease);box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
#skDown.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#skDown svg{width:13px;height:13px}
#skDown:hover{transform:translateX(-50%) translateY(-2px)}
/* ============ GRAPHS v3.2.0 ============ */
.sk-graph{margin:12px 0;border:1px solid var(--line-strong);border-radius:15px;background:var(--card);
  box-shadow:var(--shadow-sm);overflow:hidden;animation:msgIn .45s var(--ease)}
.sk-graph-t{font-size:12.5px;font-weight:750;letter-spacing:-.25px;padding:12px 15px 2px}
.sk-graph svg{display:block;width:100%;height:auto}
.g-grid{stroke:var(--line);stroke-width:1}
.g-axis{stroke:var(--muted);stroke-width:1.2;opacity:.7}
.g-tick{fill:var(--muted);font-size:9px}
.g-plbl{fill:var(--ink-soft);font-size:9.5px;font-weight:700}
.g-curve{fill:none;stroke:var(--blue);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1400;stroke-dashoffset:1400;animation:gdraw 1.4s var(--ease) .1s forwards}
@keyframes gdraw{to{stroke-dashoffset:0}}
.g-pt{fill:var(--gold);stroke:var(--card-solid);stroke-width:1.5}
.g-bar{opacity:.95}
/* ============ ZERO MAIL v3.3.0 ============ */
.sk-email{margin:12px 0;border:1px solid var(--line-strong);border-radius:15px;background:var(--card);
  box-shadow:var(--shadow-sm);padding:14px 15px;animation:msgIn .45s var(--ease)}
.sk-email-t{font-size:13px;font-weight:800;letter-spacing:-.25px;margin-bottom:10px}
.sk-email-l{display:block;font-size:10.5px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px}
.sk-email-f{display:block;width:100%;margin-top:5px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:9px 12px;outline:none;resize:vertical;line-height:1.55}
.sk-email-f:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow)}
.sk-email-btns{display:flex;gap:8px;margin:5px 0 9px;flex-wrap:wrap}
.sk-email-note{font-size:11.5px;color:var(--muted);line-height:1.55}
.sk-email-status{font-size:12.5px;font-weight:650;margin-top:9px;line-height:1.5}
</style>

<header class="hd">

  <button class="hbtn" id="btnUpdates" aria-label="Zero's upgrades" title="What Zero has upgraded about itself">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  </button>

  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="ctxrow"></div>
<div id="imgrow"><div id="imgprev"><img id="imgthumb" alt="Attached screenshot"><button id="imgx" aria-label="Remove image">×</button></div></div>

<div class="cp">
  <div class="cpcard">

    <span>Start new chat</span>
  </button>
</div>
<input type="file" id="filepick" accept="image/*" hidden>
<div id="toast"></div>
