<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zero Sidekick</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#171423; --muted:#6b6a7a; --line:#e6e4ef;
  --blue:#0071e3; --blue-d:#005bb5; --chip:#eef0f6;
  --shadow:0 10px 30px rgba(20,16,60,.10);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12101c; --card:#1b1828; --ink:#f2f0fa; --muted:#a5a2ba; --line:#2c2940; --chip:#252236; --shadow:0 10px 30px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--blue,#0071e3);outline-offset:2px;border-radius:8px}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-size:14px}
/* header */
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.mark{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:var(--blue);flex-shrink:0}
.hd-name{font-weight:800;font-size:15px;letter-spacing:-.2px}
.hd-sub{font-size:11px;color:var(--muted)}
.hd-sp{flex:1}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.hbtn:hover{color:var(--ink);border-color:var(--muted)}
.hbtn svg{width:17px;height:17px}
.lvl{border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:10px;font-size:12px;font-weight:600;padding:7px 8px;cursor:pointer;transition:border-color .15s}
.lvl:hover{border-color:var(--muted);color:var(--ink)}
/* overlays (updates) */
.ov{position:absolute;top:57px;left:10px;right:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:50;max-height:60%;overflow:auto;padding:16px;display:none}
.ov.open{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ov h3,.ov h2{font-size:13px;font-weight:800;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.upd{padding:10px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.upd:first-of-type{border-top:0}
.upd .k{display:inline-block;font-size:10.5px;font-weight:700;background:var(--chip);border-radius:6px;padding:2px 8px;margin-right:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.upd .t{font-size:11px;color:var(--muted);margin-top:3px}
/* messages */
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.greet{text-align:center;padding:26px 10px 6px}
.greet .big{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:12px 0 6px}
.greet .sub{font-size:13px;color:var(--muted);line-height:1.55;max-width:280px;margin:0 auto}
.greet .mark{width:52px;height:52px;font-size:30px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 10px 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);transition:all .15s;display:flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.chip svg{width:14px;height:14px}
.msg{max-width:92%;line-height:1.6;font-size:13.5px;animation:msgIn .25s ease;overflow-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 15px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.msg.a h1,.msg.a h2,.msg.a h3{font-size:14px;margin:8px 0 4px}
.msg.a p{margin:6px 0}
.msg.a ul,.msg.a ol{margin:6px 0 6px 18px}
.msg.a li{margin:3px 0}
.msg.a code{background:var(--chip);border-radius:6px;padding:1px 6px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.msg.a pre{background:var(--chip);border-radius:10px;padding:10px;margin:8px 0;overflow-x:auto}
.msg.a pre code{background:none;padding:0}
.msg.a a{color:var(--blue)}
.msg img.att{display:block;max-width:200px;border-radius:10px;margin-bottom:8px}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:tp 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.src{font-size:11.5px;color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:4px 10px;text-decoration:none;background:var(--bg)}
.err{background:#fdeeee;border:1px solid #f5c6c6;color:#a33;border-radius:14px;padding:12px 15px;font-size:13px;align-self:flex-start;max-width:92%}
@media (prefers-color-scheme:dark){.err{background:#3a1d1d;border-color:#5c2b2b;color:#f0b0b0}}
/* context chips row */
#ctxrow{display:none;gap:8px;padding:8px 14px 0;flex-shrink:0;flex-wrap:wrap}
#ctxrow.show{display:flex}
.ctxchip{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px;font-size:12px;max-width:100%}
.ctxchip svg{width:14px;height:14px;flex-shrink:0;color:var(--muted)}
.ctxchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ctxchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
#imgrow{display:none;padding:8px 14px 0;flex-shrink:0}
#imgrow.show{display:block}
#imgprev{position:relative;display:inline-block}
#imgprev img{max-width:120px;border-radius:10px;border:1px solid var(--line);display:block}
#imgprev button{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
/* composer */
.cp{padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);flex-shrink:0}
.cprow{display:flex;align-items:flex-end;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 8px;transition:border-color .15s}
.cprow:focus-within{border-color:var(--blue)}
.cbtn{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.cbtn:hover{background:var(--chip);color:var(--ink)}
.cbtn svg{width:18px;height:18px}
.cbtn.busy{color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#qin{flex:1;border:0;background:none;outline:none;resize:none;font:inherit;font-size:16px;color:var(--ink);max-height:120px;padding:8px 56px 8px 4px;line-height:1.5}
#send{background:var(--blue);color:#fff}
#send:hover{background:var(--blue-d)}
#send:disabled{opacity:.45;cursor:default}
.honest{text-align:center;font-size:10.5px;color:var(--muted);opacity:.7;margin-top:8px;line-height:1.4}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;border-radius:12px;padding:10px 18px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header class="hd">
  <div class="mark">0</div>
  <div><h1 class="hd-name">Zero</h1><div class="hd-sub">Sidekick</div></div>
  <div class="hd-sp"></div>
  <select class="lvl" id="lvl" aria-label="Answer depth">
    <option value="fast">Fast</option>
    <option value="balanced" selected>Balanced</option>
    <option value="deep">Deep</option>
  </select>
  <button class="hbtn" id="btnUpdates" aria-label="Zero's upgrades" title="What Zero has upgraded about itself">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
  </button>
</header>

<div class="ov" id="ovUpdates"><h2>Zero's upgrades</h2><div id="updList"><div style="font-size:13px;color:var(--muted)">Loading…</div></div></div>

<div id="msgs">
  <div class="greet" id="greet">
    <div class="mark">0</div>
    <div class="big">Ready when you are.</div>
    <div class="sub">Ask Zero anything.</div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="ctxrow"></div>
<div id="imgrow"><div id="imgprev"><img id="imgthumb" alt="Attached screenshot"><button id="imgx" aria-label="Remove image">×</button></div></div>

<div class="cp">
  <div class="cprow">
    <button class="cbtn" id="btnPlus" aria-label="Attach an image" title="Attach an image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="cbtn" id="btnShare" aria-label="Share your screen" title="Share your screen with Zero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 10l2.5-2.5M17 10l-2.5-2.5"/></svg>
    </button>
    <textarea id="qin" rows="1" placeholder="Ask Zero anything…  ( @ includes this tab )" aria-label="Ask Zero"></textarea>
    <button class="cbtn" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
  <div class="honest">Zero doesn't track you — and like any AI, it can still get things wrong. Worth double-checking important stuff.</div>
</div>
<input type="file" id="filepick" accept="image/*" hidden>
<div id="toast" role="status"></div>

<script>
try{localStorage.removeItem("zero-profile-v1");}catch(e){} /* privacy: wipe any previously stored learning data */
"use strict";
/* ================= Zero lineup (self-update) — slim mirror ================= */
window.ZeroLineup=(function(){
  var CK="zero-lineup-v1",SK="zero-lineup-sig",TTL=86400000,live=null;
  function sigOf(lu){return lu.map(function(p){return p.provider+":"+(p.models||[]).join(",");}).join("|");}
  function adopt(lu){live={};lu.forEach(function(p){if(p&&p.provider){live[String(p.provider)]=(p.models||[]).map(String);}});}
  function has(p,m){return !!(live&&live[p]&&live[p].indexOf(m)>=0);}
  function pick(p,m){return has(p,m)?{provider:p,model:m,temp:0.7}:null;}
  function sets(){
    if(!live)return null;
    var s={fast:[],balanced:[],deep:[]},i,pm,x;
    var fastP=[["groq","openai/gpt-oss-20b"],["groq","qwen/qwen3.8-27b"],["pollinations","openai"]];
    var balP=[["groq","openai/gpt-oss-120b"],["groq","openai/gpt-oss-20b"],["groq","qwen/qwen3.8-27b"],["cerebras","gpt-oss-120b"],["cerebras","qwen-3-32b"],["openrouter","openrouter/free"],["openrouter","meta-llama/llama-3.3-70b-instruct:free"],["mistral","mistral-small-latest"],["pollinations","openai"]];
    for(i=0;i<fastP.length;i++){pm=fastP[i];x=pick(pm[0],pm[1]);if(x)s.fast.push(x);}
    for(i=0;i<balP.length;i++){pm=balP[i];x=pick(pm[0],pm[1]);if(x)s.balanced.push(x);}
    Object.keys(live).forEach(function(p){live[p].forEach(function(m){s.deep.push({provider:p,model:m,temp:0.7});});});
    return s;
  }
  function toastSafe(m){toast(m);}
  function refresh(){
    var cached=null;
    try{cached=JSON.parse(localStorage.getItem(CK));}catch(e){}
    var fresh=cached&&cached.ts&&(Date.now()-cached.ts)<TTL&&cached.lineup;
    if(fresh){adopt(cached.lineup);return;}
    if(cached&&cached.lineup)adopt(cached.lineup);
    fetch("zero-lineup.php",{method:"GET"}).then(function(r){return r.json();}).then(function(d){
      if(!d||d.ok!==true||!d.lineup||!d.lineup.length)return;
      var sig=sigOf(d.lineup),prev=null;
      try{prev=localStorage.getItem(SK);}catch(e){}
      adopt(d.lineup);
      try{localStorage.setItem(CK,JSON.stringify({ts:Date.now(),lineup:d.lineup}));localStorage.setItem(SK,sig);}catch(e){}
      if(prev&&prev!==sig)toastSafe("Zero refreshed its AI lineup");
    }).catch(function(){});
  }
  try{refresh();}catch(e){}
  return{sets:sets,refresh:refresh};
})();

/* ================= helpers ================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var toastT=null;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2600);}
/* tiny safe markdown renderer */
function md(src){
  var h=esc(src);
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,l,c){return "<pre><code>"+c.replace(/^\n+|\n+$/g,"")+"</code></pre>";});
  h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  h=h.replace(/(^|\n)#{1,4}\s*([^\n]+)/g,"$1<b>$2</b>");
  h=h.replace(/(^|\n)[-*]\s+([^\n]+)/g,"$1• $2");
  h=h.replace(/(^|\n)(\d+)\.\s+([^\n]+)/g,"$1$2. $3");
  h=h.replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
  h=h.replace(/(https?:\/\/[^\s<")]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return "<p>"+h+"</p>";
}
function fetchT(url,opts,ms){
  ms=ms||15000;
  return new Promise(function(res,rej){
    var to=setTimeout(function(){rej(new Error("timeout"));},ms);
    fetch(url,opts).then(function(r){clearTimeout(to);res(r);},function(e){clearTimeout(to);rej(e);});
  });
}

/* ================= state ================= */
var zhist=[];              // {role, text} last exchanges
var attachedImg=null;      // screenshot / uploaded image dataURL
var tabCtx=null;           // {title,url} from the extension bridge
var tabAttached=false;
var busy=false;
var inExtension=(window.parent!==window);

/* ================= bridge (extension shell <-> panel) ================= */
window.addEventListener("message",function(e){
  var o=String(e.origin||"");
  if(o.indexOf("chrome-extension://")!==0)return;         // only the sidekick shell
  var d=e.data||{};
  if(d.type==="zero-image"&&d.dataUrl){
    attachImage(String(d.dataUrl));
    var sb=$("btnShare");sb.classList.remove("busy");
    toast("Screen attached — ask Zero about it.");
  }else if(d.type==="zero-tab"&&d.title){
    tabCtx={title:String(d.title).slice(0,120),url:String(d.url||"").slice(0,300)};
    renderTabChip();
  }else if(d.type==="zero-image-error"){
    $("btnShare").classList.remove("busy");
    toast("Couldn't capture the screen — try again.");
  }
});
function postToShell(msg){
  try{window.parent.postMessage(msg,"*");}catch(e){}
}

/* ================= tab chip ================= */
var SVG_DOC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
function renderTabChip(){
  var row=$("ctxrow");
  if(!tabCtx){row.className="";row.innerHTML="";tabAttached=false;return;}
  row.className="show";
  row.innerHTML="";
  var c=document.createElement("div");c.className="ctxchip";
  c.innerHTML=SVG_DOC+"<span>@ "+esc(tabCtx.title)+"</span>";
  var x=document.createElement("button");x.textContent="×";x.setAttribute("aria-label","Detach tab");
  x.onclick=function(){tabCtx=null;renderTabChip();};
  c.appendChild(x);row.appendChild(c);
  tabAttached=true;
}

/* ================= image attach ================= */
function attachImage(dataUrl){
  var img=new Image();
  img.onload=function(){
    var max=1280,w=img.width,h=img.height;
    if(w>max){h=Math.round(h*max/w);w=max;}
    var c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    attachedImg=c.toDataURL("image/jpeg",0.85);
    $("imgthumb").src=attachedImg;
    $("imgrow").className="show";
  };
  img.src=dataUrl;
}
$("imgx").onclick=function(){attachedImg=null;$("imgrow").className="";};

/* ================= messages ================= */
function addMsg(role,html){
  var g=$("greet");if(g)g.style.display="none";
  var ch=$("chips");if(ch)ch.style.display="none";
  var d=document.createElement("div");
  d.className="msg "+(role==="user"?"u":"a");
  d.innerHTML=html;
  $("msgs").appendChild(d);
  $("msgs").scrollTop=$("msgs").scrollHeight;
  return d;
}
function addTyping(){return addMsg("ai",'<span class="typing"><span></span><span></span><span></span></span>');}

/* ================= suggestion chips ================= */
var SVG_SPARK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>';
var SVG_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
var SVG_BOOK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>';
var SVG_PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
var CHIPS=[
  {icon:SVG_CAM,label:"Explain my screen",fn:function(){shareScreen("What's on my screen? Explain it in simple terms.");}},
  {icon:SVG_DOC,label:"Summarize this tab",fn:function(){ask("Please summarize the key points of what I'm looking at, in a few short bullets.",true);}},
  {icon:SVG_BOOK,label:"Help me study",fn:function(){ask("I want to study. Ask me what subject and what I need help with, then teach me.",false);}},
  {icon:SVG_PEN,label:"Write it better",fn:function(){ask("Help me write something better. Ask me what it's for first.",false);}}
];
CHIPS.forEach(function(c){
  var b=document.createElement("button");b.className="chip";
  b.innerHTML=c.icon+"<span>"+esc(c.label)+"</span>";
  b.onclick=c.fn;$("chips").appendChild(b);
});

/* ================= composer actions ================= */
$("btnShare").onclick=function(){shareScreen(null);};
function shareScreen(presetQ){
  if(!inExtension){toast("Open this panel from the Zero Sidekick extension to share your screen.");return;}
  var sb=$("btnShare");sb.classList.add("busy");
  if(presetQ){$("qin").value=presetQ;}
  postToShell({type:"zero-capture"});
  setTimeout(function(){sb.classList.remove("busy");},8000);
}
$("btnPlus").onclick=function(){$("filepick").click();};
$("filepick").addEventListener("change",function(){
  var f=$("filepick").files[0];$("filepick").value="";
  if(!f||f.type.indexOf("image/")!==0)return;
  var r=new FileReader();
  r.onload=function(){attachImage(r.result);toast("Image attached.");};
  r.readAsDataURL(f);
});
var qin=$("qin");
qin.addEventListener("input",function(){qin.style.height="auto";qin.style.height=Math.min(120,qin.scrollHeight)+"px";});
qin.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}});
$("send").onclick=doSend;

function ask(text,useTab){
  if(useTab&&!tabCtx){toast("The sidekick will pick up your current tab automatically.");}
  $("qin").value=text;doSend();
}

/* ================= AI send ================= */
var SYS_BASE="You are Zero, a sharp and friendly AI assistant living in a browser side panel. Answer directly and well. Match length to the question: one-liners get short answers, casual chat gets 1-2 warm sentences, only complex questions earn structured answers. Never invent dates, statistics, names, or URLs — say when you're unsure. Plain markdown only, no raw HTML tags. Always identify as Zero. If the viewer shared a screenshot or a tab, look at it carefully and ground your answer in what you actually see.";
var SMALLTALK=/^(hi+|hey+|hello+|yo|sup|how are you( doing)?( today)?|how'?s it going|what'?s up|thanks|thank you|thx|good ?(morning|afternoon|evening|night)|bye+|goodbye|good ?night|see you( later)?|who are you)\s*[?!.]*$/i;
var HARD_FAST=[{provider:"groq",model:"qwen/qwen3.8-27b",temp:0.7},{provider:"groq",model:"openai/gpt-oss-20b",temp:0.7},{provider:"pollinations",model:"openai",temp:0.7}];
var HARD_BAL=[{provider:"groq",model:"openai/gpt-oss-120b",temp:0.7},{provider:"groq",model:"openai/gpt-oss-20b",temp:0.7},{provider:"groq",model:"qwen/qwen3.8-27b",temp:0.7},{provider:"cerebras",model:"gpt-oss-120b",temp:0.7},{provider:"openrouter",model:"openrouter/free",temp:0.7},{provider:"mistral",model:"mistral-small-latest",temp:0.7},{provider:"pollinations",model:"openai",temp:0.7}];
var HARD_ALL=HARD_BAL.concat([{provider:"cerebras",model:"qwen-3-32b",temp:0.7},{provider:"openrouter",model:"meta-llama/llama-3.3-70b-instruct:free",temp:0.7}]);

function doSend(){
  if(busy)return;
  var text=qin.value.trim();
  if(!text&&!attachedImg)return;
  if(attachedImg&&!text)text="What\u2019s in this image?";
  // @ tab: leading @ forces tab context even without the chip
  var wantTab=tabAttached||/^@\s*/.test(text);
  text=text.replace(/^@\s*/,"");
  var img=attachedImg;attachedImg=null;$("imgrow").className="";
  qin.value="";qin.style.height="auto";

  var sys=SYS_BASE;
  if(wantTab&&tabCtx)sys+="\n\nThe viewer is currently looking at: "+tabCtx.title+" ("+tabCtx.url+"). They attached this tab for context — use it when relevant.";

  var userContent=img?[{type:"text",text:text},{type:"image_url",image_url:{url:img}}]:text;
  var msgs=[{role:"system",content:sys}];
  zhist.slice(-10).forEach(function(m){msgs.push({role:m.role==="user"?"user":"assistant",content:String(m.text).slice(0,2000)});});
  msgs.push({role:"user",content:userContent});

  addMsg("user",(img?'<img class="att" src="'+img+'" alt="attached">':"")+(tabCtx&&wantTab?'<div style="font-size:11px;opacity:.75;margin-bottom:6px">@ '+esc(tabCtx.title)+'</div>':"")+esc(text));
  zhist.push({role:"user",text:text});
  busy=true;$("send").disabled=true;
  var level=$("lvl").value||"balanced";

  function doneFail(){
    busy=false;$("send").disabled=false;
    var d=document.createElement("div");d.className="err";
    d.textContent="Zero couldn't reach its AI models right now. Check your connection and try again.";
    $("msgs").appendChild(d);$("msgs").scrollTop=$("msgs").scrollHeight;
  }
  function finish(answer,sources){
    busy=false;$("send").disabled=false;
    zhist.push({role:"ai",text:String(answer).slice(0,4000)});
    zhist=zhist.slice(-20);
    var box=addMsg("ai",md(answer));
    if(sources&&sources.length){
      var s=document.createElement("div");s.className="srcs";
      sources.slice(0,6).forEach(function(x){
        var a=document.createElement("a");a.className="src";a.target="_blank";a.rel="noopener";
        a.href=x.url||"#";a.textContent=String(x.title||x.url||"source").slice(0,40);
        s.appendChild(a);
      });
      box.appendChild(s);
    }
  }

  // small-talk fast path
  if(SMALLTALK.test(text)&&!img){
    var t0=addTyping();
    fetchT("api-single.php",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({provider:"groq",model:"openai/gpt-oss-20b",temp:0.7,max_tokens:200,
        messages:[{role:"system",content:"You are Zero, a warm friendly AI assistant. The user just said something casual. Reply in 1-2 short sentences, warm and natural with a little personality. No lists, no headings."},{role:"user",content:text}]})},15000)
      .then(function(r){return r.json();}).then(function(j){
        t0.remove();
        finish(j.answer||j.text||"Hey! I'm here and ready — what can I do for you?");
      }).catch(function(){t0.remove();doneFail();});
    return;
  }

  var t1=addTyping();
  var liveSets=(window.ZeroLineup&&window.ZeroLineup.sets)?window.ZeroLineup.sets():null;
  function liveOr(l,h){return(l&&l.length)?l:h;}
  var models=level==="fast"?liveOr(liveSets&&liveSets.fast,HARD_FAST)
    :level==="deep"?liveOr(liveSets&&liveSets.deep,HARD_ALL)
    :liveOr(liveSets&&liveSets.balanced,HARD_BAL);

  var calls=models.map(function(m){
    return fetchT("api-single.php",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:msgs,model:m.model,temp:m.temp,provider:m.provider})},15000)
      .then(function(r){return r.json();})
      .then(function(d){return(d&&d.answer)?String(d.answer):null;})
      .catch(function(){return null;});
  });
  Promise.all(calls).then(function(answers){
    var valid=answers.filter(function(a){return a&&a.length>10;});
    if(!valid.length)throw new Error("all-models-failed");
    return fetchT("api-synth.php",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:msgs,responses:valid})},30000);
  }).then(function(r){return r.json();}).then(function(data){
    t1.remove();
    if(data.error)throw new Error(data.error);
    finish(data.answer||"Sorry — I couldn't put together an answer.",data.sources||[]);
  }).catch(function(){t1.remove();doneFail();});
}

/* ================= updates feed ================= */
function timeAgo(ts){
  var s=Math.floor(Date.now()/1000-ts);
  if(s<60)return"just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function loadUpdates(){
  fetch("zero-upgrades.php",{method:"GET"}).then(function(r){return r.json();}).then(function(d){
    var el=$("updList");
    var list=(d&&d.upgrades)||[];
    if(!list.length){el.innerHTML='<div style="font-size:13px;color:var(--muted)">No upgrades logged yet — check back after Zero updates itself.</div>';return;}
    el.innerHTML="";
    list.slice(0,20).forEach(function(u){
      var d2=document.createElement("div");d2.className="upd";
      d2.innerHTML='<span class="k">'+esc(u.kind||"update")+'</span><span>'+esc(u.detail||"")+'</span><div class="t">'+timeAgo(u.ts||0)+'</div>';
      el.appendChild(d2);
    });
  }).catch(function(){
    $("updList").innerHTML='<div style="font-size:13px;color:var(--muted)">Couldn\'t load the upgrade feed.</div>';
  });
}
function closeOvs(){$("ovUpdates").classList.remove("open");}
$("btnUpdates").onclick=function(e){e.stopPropagation();var o=$("ovUpdates");var was=o.classList.contains("open");closeOvs();if(!was){o.classList.add("open");loadUpdates();}};
document.addEventListener("click",function(e){if(!e.target.closest(".ov")&&!e.target.closest(".hbtn"))closeOvs();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeOvs();});
// Phone view: shorten the composer hint on narrow screens so it never tucks under the send button.
if(window.innerWidth<480){try{var _pq=document.getElementById("qin");if(_pq)_pq.placeholder="Ask Zero anything…";}catch(_pqe){}}
</script>
</body>
</html>
