<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web results</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  body{padding:10px 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .gsc-control-cse{border:0 !important;background:transparent !important;padding:0 !important;}
  .cse-fallback{color:#5b6470;font-size:14px;padding:14px 4px;}
  .cse-fallback a{color:#0064e0;}
</style>
</head>
<body>
<div id="r"></div>
<script>
(function(){
  function qs(n){ var m=location.search.match(new RegExp("[?&]"+n+"=([^&]*)")); return m?decodeURIComponent(m[1]):""; }
  var cx = qs("cx") || "d1a2fb2c4de99486f";
  var q = qs("q");
  function report(){
    try{
      var h=Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      parent.postMessage({cseHeight:h}, "*");
    }catch(e){}
  }
  function fail(){
    document.getElementById("r").innerHTML =
      '<p class="cse-fallback">Web results are not available right now. ' +
      '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q) + '">Search on Google</a></p>';
    report();
  }
  if(!q){ fail(); return; }
  var s=document.createElement("script");
  s.src="https://cse.google.com/cse.js?cx="+encodeURIComponent(cx);
  s.async=true;
  s.onerror=fail;
  s.onload=function(){
    var tries=0;
    (function tick(){
      tries++;
      try{
        if(window.google && google.search && google.search.cse){
          google.search.cse.element.render({div:"r", tag:"searchresults-only", gname:"z",
            attributes:{enableImageSearch:true, linkTarget:"_blank", enableHistory:false}});
          var el=google.search.cse.element.getElement("z");
          if(el){ el.execute(q); }
          setTimeout(report, 400);
          setTimeout(report, 1600);
          return;
        }
      }catch(e){ fail(); return; }
      if(tries<60) setTimeout(tick, 250); else fail();
    })();
  };
  document.head.appendChild(s);
  if(window.MutationObserver){
    new MutationObserver(function(){ report(); })
      .observe(document.documentElement, {childList:true, subtree:true});
  }
  window.addEventListener("load", function(){ setTimeout(report, 800); });
})();
</script>
</body>
</html>
